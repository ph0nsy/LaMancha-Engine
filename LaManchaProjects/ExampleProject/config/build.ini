[general]
project_name = ExampleProject
project_version = 0.0.1

[directories] # Which source directories to compile
include_dirs = src, src/game, src/entities
exclude_dirs = src/editor, src/deprecated
include_assets = assets/textures, assets/audio, assets/scripts
exclude_assets = assets/source, assets/*.psd
engine_dir = C:/LaMancha-Engine

[target] # Which platform to build for and graphics backend to use
platform = windows # r36s
graphics_backend = glfw # egl

[packaging] # How to package the game
compress_assets = true
compression_library = miniz # recomended -> Desktop: miniz | Embeded Linux: lz4
compression_format = zlib 
create_pak = true
pak_filename = gameAssets.pak
include_debug_symbols = false
