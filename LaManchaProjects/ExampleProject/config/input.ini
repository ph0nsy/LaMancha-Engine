[keyboard] # Desktop keyboard mapping
move_up = W
move_down = S
move_left = A
move_right = D
jump = Space
attack = Mouse1

[gamepad_r36s] # R36S controller button mapping
move_up = DPad_Up
move_down = DPad_Down
move_left = DPad_Left
move_right = DPad_Right
jump = Button_A
attack = Button_B

[gamepad_xbox] # Xbox controller button mapping
move_up = LeftStick_Up
move_down = LeftStick_Down
move_left = LeftStick_Left
move_right = LeftStick_Right
jump = Button_A
attack = Button_X